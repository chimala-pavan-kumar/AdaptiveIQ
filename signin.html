
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in - AdaptIQ</title>

    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <div class="login-container">

        <h1>Log in</h1>

        <p class="register-text">
            New user?
            <a href="signup.html">Register Now</a>
        </p>


        <!-- Google Login -->

        <button class="google-btn" type="button">
            <span class="google-icon">G</span>
            Continue with Google
        </button>


        <!-- OR -->

        <div class="divider">
            <span>or</span>
        </div>


        <!-- Login Form -->

        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username or email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="forgot-password">

                <a href="#">
                    Forgot password
                </a>

            </div>


            <button class="signin-btn" type="submit">
                Sign In
            </button>

        </form>
